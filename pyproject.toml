[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantsplit"
version = "0.2.0"
description = "Research implementation of probability/support crossed decoding"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
model = ["torch==2.8.0", "transformers==4.57.1", "safetensors>=0.4,<1"]
data = ["datasets==4.3.0"]

[tool.setuptools.packages.find]
where = ["src"]
